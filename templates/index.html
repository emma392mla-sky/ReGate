<!DOCTYPE html>
<html lang="en">
<head>
    <title>Recon</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body, html {
  height: 100%;
  font-family: Arial, sans-serif;
}
</style>
</head>


<body>
 <h1>Welcome {{name}}</h1>
 <br>
 <button onclick="runit()">call</button>

 <script>
     function runit(){
        fetch("/run",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                name:"sky",
                phone:"0892012517"
            })
        })
            .then(response => response.json())
            .then(data => {
                //use document to receive data
                alert("name: "+data.name+" phone:"+data.phone);
            })
            .catch(error => {
                alert('connection error:'+error)
            });
       
     }
 </script>
</body>
</html>
